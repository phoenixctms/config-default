# mod_fcgid limits for the signup webapp (dispatch.fcgi), installed to conf-available by install_apache.sh and upgrade.sh
<IfModule mod_fcgid.c>
    # the default of 128 KB rejects FILE uploads (the ctsms input_field_file_value_size_limit of 10 MB, plus the rest of the form)
    FcgidMaxRequestLen 16777216
    # each process is a full perl/dancer stack, sharing memory with tomcat
    FcgidMaxProcessesPerClass 16
    FcgidMaxRequestsPerProcess 1000
    # rest calls to ctsms can take longer than the default 40 seconds
    FcgidIOTimeout 120
</IfModule>
